<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="fadeTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b18c45" stop-opacity="0"/>
      <stop offset="15%" stop-color="#b18c45" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#b18c45" stop-opacity="0.38"/>
      <stop offset="85%" stop-color="#b18c45" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#b18c45" stop-opacity="0"/>
    </linearGradient>

    <g id="treadUnit">
      <path d="M0 0 L18 10 L0 20 L18 30" fill="none" stroke="url(#fadeTrack)" stroke-width="8" stroke-linecap="square"/>
      <path d="M42 0 L24 10 L42 20 L24 30" fill="none" stroke="url(#fadeTrack)" stroke-width="8" stroke-linecap="square"/>
    </g>

    <g id="trackColumn">
      <use href="#treadUnit" y="0"/>
      <use href="#treadUnit" y="38"/>
      <use href="#treadUnit" y="76"/>
      <use href="#treadUnit" y="114"/>
      <use href="#treadUnit" y="152"/>
      <use href="#treadUnit" y="190"/>
      <use href="#treadUnit" y="228"/>
      <use href="#treadUnit" y="266"/>
      <use href="#treadUnit" y="304"/>
      <use href="#treadUnit" y="342"/>
      <use href="#treadUnit" y="380"/>
    </g>
  </defs>

  <g transform="translate(170,10) rotate(-18 400 220)">
    <!-- trilha esquerda -->
    <g opacity="0.9">
      <use href="#trackColumn" x="0"/>
      <use href="#trackColumn" x="48"/>
      <use href="#trackColumn" x="96"/>
    </g>

    <!-- trilha direita -->
    <g transform="translate(250,0)" opacity="0.9">
      <use href="#trackColumn" x="0"/>
      <use href="#trackColumn" x="48"/>
      <use href="#trackColumn" x="96"/>
    </g>
  </g>
</svg>
